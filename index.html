<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт товаров</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #1e1e1e; padding: 15px 25px; border-radius: 8px; min-width: 150px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select { background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; }
        button { background: #2ecc71; border: none; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        button.delete-btn { background: #e74c3c; padding: 4px 8px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        .type-purchase { color: #2ecc71; }
        .type-sale { color: #3498db; }
        
        /* Стили для перетаскивания */
        tr[draggable="true"] { cursor: grab; }
        tr[draggable="true"]:active { cursor: grabbing; }
        tr.dragging { opacity: 0.5; background: #2a2a2a; }
    </style>
</head>
<body>

    <h2>Учёт товаров</h2>

    <!-- Карточки статистики -->
    <div class="stats">
        <div class="card"><div>Потрачено</div><h3 id="total-spent">0 ₽</h3></div>
        <div class="card"><div>Продано</div><h3 id="total-sold">0 ₽</h3></div>
        <div class="card"><div>Прибыль</div><h3 id="total-profit">0 ₽</h3></div>
    </div>

    <!-- Форма добавления -->
    <div class="form-group">
        <input type="text" id="itemName" placeholder="Название товара">
        <input type="number" id="itemPrice" placeholder="Цена (₽)">
        <select id="itemType">
            <option value="Покупка">Покупка</option>
            <option value="Продажа">Продажа</option>
        </select>
        <button onclick="addItem()">Добавить</button>
    </div>

    <!-- Таблица -->
    <table>
        <thead>
            <tr>
                <th>Товар</th>
                <th>Тип</th>
                <th>Время</th>
                <th>Сумма</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Сюда JS будет добавлять строки -->
        </tbody>
    </table>

    <script>
        // Массив для хранения добавленных товаров
        let items = [];

        // Функция отрисовки таблицы и пересчета статистики
        function render() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = ''; // Очищаем таблицу

            let spent = 0;
            let sold = 0;

            items.forEach((item, index) => {
                // Считаем деньги в зависимости от типа операции
                if (item.type === 'Покупка') {
                    spent += item.price;
                } else {
                    sold += item.price;
                }

                // Добавлен атрибут draggable="true" и data-index
                // Добавлен вывод времени ${item.time}
                tableBody.innerHTML += `
                    <tr draggable="true" data-index="${index}">
                        <td>${item.name}</td>
                        <td class="${item.type === 'Покупка' ? 'type-purchase' : 'type-sale'}">${item.type}</td>
                        <td style="color: #888; font-size: 14px;">${item.time}</td>
                        <td>${item.price.toLocaleString('ru-RU')} ₽</td>
                        <td>
                            <button class="delete-btn" onclick="deleteItem(${item.id})">Удалить</button>
                        </td>
                    </tr>
                `;
            });

            // Обновляем верхние карточки
            document.getElementById('total-spent').innerText = `${spent.toLocaleString('ru-RU')} ₽`;
            document.getElementById('total-sold').innerText = `${sold.toLocaleString('ru-RU')} ₽`;
            
            const profit = sold - spent;
            document.getElementById('total-profit').innerText = `${profit.toLocaleString('ru-RU')} ₽`;

            // Инициализируем события перетаскивания для новых строк
            initDragAndDrop();
        }

        // Функция добавления нового товара
        function addItem() {
            const nameInput = document.getElementById('itemName');
            const priceInput = document.getElementById('itemPrice');
            const typeSelect = document.getElementById('itemType');

            if (!nameInput.value || !priceInput.value) {
                alert('Заполните все поля!');
                return;
            }

            // Получаем текущее время в формате ЧЧ:ММ:СС
            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const newItem = {
                id: Date.now(), 
                name: nameInput.value,
                price: parseFloat(priceInput.value),
                type: typeSelect.value,
                time: timeString // Сохраняем время операции
            };

            items.push(newItem);
            render();

            // Очищаем поля ввода
            nameInput.value = '';
            priceInput.value = '';
        }

        // Функция удаления товара
        window.deleteItem = function(id) {
            items = items.filter(item => item.id !== id);
            render();
        }

        // Логика Drag and Drop перетаскивания строк
        function initDragAndDrop() {
            const rows = document.querySelectorAll('#table-body tr');
            const tableBody = document.getElementById('table-body');
            let dragSrcIndex = null;

            rows.forEach(row => {
                row.addEventListener('dragstart', function(e) {
                    dragSrcIndex = this.getAttribute('data-index');
                    this.classList.add('dragging');
                });

                row.addEventListener('dragover', function(e) {
                    e.preventDefault(); // Разрешаем сброс элемента
                });

                row.addEventListener('drop', function(e) {
                    e.preventDefault();
                    const targetIndex = this.getAttribute('data-index');
                    
                    if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
                        // Меняем элементы местами в исходном массиве данных
                        const draggedItem = items[dragSrcIndex];
                        items.splice(dragSrcIndex, 1);
                        items.splice(targetIndex, 0, draggedItem);
                        
                        // Перерисовываем таблицу с новым порядком
                        render();
                    }
                });

                row.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                });
            });
        }
    </script>
</body>
</html>
